# Render blueprint: Web Service + managed PostgreSQL (free tier OK).
# Push this repo to GitHub, then: Render dashboard -> New -> Blueprint -> select repo.
services:
  - type: web
    name: medication-reminder-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medication-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://medication-reminder-agent-snw7.vercel.app,https://medication-reminder-agent-ochre.vercel.app,http://localhost:5173
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "90"
      - key: FRONTEND_URL
        value: https://medication-reminder-agent-snw7.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: maheshburra2712@gmail.com
      - key: SMTP_PASSWORD
        value: "kgsh sfcb irwd mxna"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false

databases:
  - name: medication-db
    plan: free
